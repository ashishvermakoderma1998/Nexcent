<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexcen</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="nav-container">
                <div>
                    <img src="./image/Logo.png" alt="Nexcent Logo">
                </div>
                <div class="nav-links">
                    <ul class="nav-list">
                        <li><a class="nav-link" href="#">Home</a></li>
                        <li><a class="nav-link" href="#">Features</a></li>
                        <li><a class="nav-link" href="#">Community</a></li>
                    </ul>
                    <button class="register-btn">Register Now</button>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <section>
            <div class="hero-container">
                <div class="hero-text">
                    <h2>Lesson and Insights</h2>

                    <p>Where to grow your business as photographer side or social media ?</p>
                    <button class=" register-btn2">Register Now</button>

                <div class="hero-banner">
                    <img class="banner-img" src="./image/Illustration.png" alt="main">
                </div>
            </div>
            
        </section>

        <section>
            <div class="client-container">
                <div class="client-text">
                    <h2>Our Clients</h2>
                    <p>We have Working with some Fortune 500+ Clients</p>
                </div>
                <div class="client-logos">
                    <img class="client-img" src="./image/Logo (1).png" alt="logo1">
                    <img class="client-img" src="./image/Logo (2).png" alt="logo1">
                    <img class="client-img" src="./image/Logo (3).png" alt="logo1">
                    <img class="client-img" src="./image/Logo (3).png" alt="logo1">
                    <img class="client-img" src="./image/Logo (4).png" alt="logo1">
                    <img class="client-img" src="./image/Logo (5).png" alt="logo1">
                </div>
            </div>
        </section>

        <section>
            <div>
                <div>
                    <h4>Manage Your Entire Community</h4>
                    <h4>in single system</h4>
                    <p>who is Nexcent suitable for</p>
                </div>
                <div>
                    
                </div>
                
            </div>
        </section>
    </main>
